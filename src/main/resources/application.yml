spring:
  application:
    name: hopeful-return-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        use_nationalized_character_data: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:3434}

jwt:
  secret: ${JWT_SECRET:local-dev-secret-please-change-this-to-a-long-random-value-256bit}
  access-token-validity: ${JWT_ACCESS_VALIDITY:1800000}
  refresh-token-validity: ${JWT_REFRESH_VALIDITY:1209600000}

app:
  mail:
    verification-ttl-seconds: ${MAIL_VERIFICATION_TTL:300}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
