spring:
  application:
    name: hopeful-return-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        use_nationalized_character_data: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          # 포트 465 = 암시적 SSL(SMTPS). 서버(outbound.daouoffice.com:465)는 접속 즉시 TLS 핸드셰이크를 하므로
          # ssl.enable=true 가 필수다. 587(STARTTLS)로 바꿀 때만 MAIL_SSL_ENABLE=false·MAIL_STARTTLS_ENABLE=true 로 주입.
          ssl:
            enable: ${MAIL_SSL_ENABLE:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:false}
          # 메일 서버 무응답 시 비동기 발송 스레드가 무한 대기하지 않도록 타임아웃(ms)
          connectiontimeout: ${MAIL_CONNECT_TIMEOUT:5000}
          timeout: ${MAIL_READ_TIMEOUT:5000}
          writetimeout: ${MAIL_WRITE_TIMEOUT:5000}

server:
  port: ${SERVER_PORT:3434}

jwt:
  secret: ${JWT_SECRET:local-dev-secret-please-change-this-to-a-long-random-value-256bit}
  access-token-validity: ${JWT_ACCESS_VALIDITY:3600000}
  refresh-token-validity: ${JWT_REFRESH_VALIDITY:1209600000}

app:
  mail:
    # 발신자 주소. 미지정 시 인증 계정(MAIL_USERNAME)을 사용한다. SMTP 서버는 발신자가
    # 인증 계정과 일치하지 않으면 553(mail box not allowed)로 거부하므로 기본값을 MAIL_USERNAME 으로 둔다.
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    verification-ttl-seconds: ${MAIL_VERIFICATION_TTL:300}
  cookie:
    # RefreshToken 쿠키 Secure 속성. 기본 true(HTTPS 전제).
    # HTTP 평문 배포(http://IP:3434)에서는 COOKIE_SECURE=false 로 주입해야 쿠키가 저장·전송된다.
    secure: ${COOKIE_SECURE:true}

# Naver Cloud SENS (문자 발송). sens.enabled=true 로 실연동, 미설정(false)이면 NoOp 폴백.
sens:
  enabled: ${SENS_ENABLED:false}
  access-key: ${SENS_ACCESS_KEY:}
  secret-key: ${SENS_SECRET_KEY:}
  service-id: ${SENS_SERVICE_ID:}
  from: ${SENS_FROM:}
  # 발송결과 조회 폴링(실연동 시): PENDING 이력의 실제 전달 상태를 주기적으로 갱신.
  result-poll:
    interval-ms: ${SENS_RESULT_POLL_INTERVAL_MS:60000}
    max-age-hours: ${SENS_RESULT_POLL_MAX_AGE_HOURS:24}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # SMTP 미설정 상태에서는 메일 헬스체크 비활성 (설정 후 true 로)
    mail:
      enabled: false
